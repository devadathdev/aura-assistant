[project]
name = "sentinel-api"
version = "0.1.0"
description = "SENTINEL API Service"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "python-ulid>=2.4",
    "redis>=5.0",
    "asyncpg>=0.29",
    "sqlalchemy[asyncio]>=2.0",
    "alembic>=1.13",
    "python-jose[cryptography]>=3.3",
    "passlib[bcrypt]>=1.7",
    "httpx>=0.27",
    "python-dateutil>=2.9",
    "pydantic-extra-types>=2.7",
    "sentinel-schemas @ file:///root/SENTINEL/sentinel/packages/schemas",
    "sentinel-security-sdk @ file:///root/SENTINEL/sentinel/packages/security-sdk",
]

[project.optional-dependencies]
dev = ["pytest>=8.2", "pytest-asyncio>=0.23", "pytest-cov>=4.1", "httpx>=0.27", "faker>=24.0"]

[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.13"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
show_error_codes = true
namespace_packages = true
explicit_package_bases = true
mypy_path = ["/root/SENTINEL/sentinel/packages/schemas", "/root/SENTINEL/sentinel/packages/security-sdk"]

[[tool.mypy.overrides]]
module = "sentinel_schemas.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "sentinel_security.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "sqlalchemy.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "jose.*"
ignore_missing_imports = true