name: Build AURA Desktop

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - 'desktop/**'
      - 'public/**'
      - 'server.js'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/aura-desktop.yml'
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run desktop:build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Upload installer artifacts
        uses: actions/upload-artifact@v4
        with:
          name: aura-windows
          path: dist/*
