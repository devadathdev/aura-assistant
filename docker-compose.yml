version: '3.8'

services:
  # ──────────────────────────────────────────────────────────────
  # AURA Assistant (Node.js)
  # ──────────────────────────────────────────────────────────────
  aura:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - NEWS_API_KEY=${NEWS_API_KEY}
      - NEWS_API_QUERY=${NEWS_API_QUERY:-world OR global OR international}
      - NEWS_API_LANGUAGE=${NEWS_API_LANGUAGE:-en}
    volumes:
      - ./public:/app/public:ro
      - ./core:/app/core:ro
      - ./server.js:/app/server.js:ro
      - ./start-all.js:/app/start-all.js:ro
      - aura-learning:/app/learning-data.json
      - aura-skills:/app/skills-data.json
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/status"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    networks:
      - aura-network

  # ──────────────────────────────────────────────────────────────
  # FORGE API (Node.js + Fastify)
  # ──────────────────────────────────────────────────────────────
  forge-api:
    build:
      context: ./FORGE
      dockerfile: docker/Dockerfile.api
    ports:
      - "4000:4000"
    environment:
      - NODE_ENV=development
      - PORT=4000
      - DATABASE_URL=postgresql://forge:forge@postgres:5432/forge
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - JWT_SECRET=${JWT_SECRET:-your-super-secret-jwt-key-change-in-production}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY:-your-32-char-encryption-key-here}
      - CORS_ORIGIN=http://localhost:3000,http://localhost:3001,http://localhost:3002
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./FORGE:/app
      - /app/node_modules
      - /app/packages/*/node_modules
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    restart: unless-stopped
    networks:
      - aura-network

  # ──────────────────────────────────────────────────────────────
  # FORGE Web (Next.js)
  # ──────────────────────────────────────────────────────────────
  forge-web:
    build:
      context: ./FORGE
      dockerfile: docker/Dockerfile.web
    ports:
      - "3001:3000"
    environment:
      - NODE_ENV=development
      - PORT=3000
      - NEXT_PUBLIC_API_URL=http://localhost:4000
    depends_on:
      - forge-api
    volumes:
      - ./FORGE:/app
      - /app/node_modules
      - /app/.next
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    networks:
      - aura-network

  # ──────────────────────────────────────────────────────────────
  # FORGE Worker (BullMQ)
  # ──────────────────────────────────────────────────────────────
  forge-worker:
    build:
      context: ./FORGE
      dockerfile: docker/Dockerfile.worker
    environment:
      - NODE_ENV=development
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - DATABASE_URL=postgresql://forge:forge@postgres:5432/forge
      - WORKER_CONCURRENCY=2
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./FORGE:/app
      - /app/node_modules
      - /app/packages/*/node_modules
    restart: unless-stopped
    networks:
      - aura-network

  # ──────────────────────────────────────────────────────────────
  # SENTINEL API (Python FastAPI)
  # ──────────────────────────────────────────────────────────────
  sentinel-api:
    build:
      context: ./SENTINEL/sentinel
      dockerfile: apps/api/Dockerfile
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=development
      - HOST=0.0.0.0
      - PORT=8000
      - DATABASE_URL=postgresql+asyncpg://sentinel:sentinel@postgres:5432/sentinel
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=${SENTINEL_SECRET_KEY:-your-super-secret-key-change-in-production-min-32-chars}
      - JWT_ALGORITHM=HS256
      - ACCESS_TOKEN_EXPIRE_MINUTES=30
      - REFRESH_TOKEN_EXPIRE_DAYS=7
      - CORS_ORIGINS=["http://localhost:3000","http://localhost:3001","http://localhost:3002"]
      - CORS_ALLOW_CREDENTIALS=true
      - AI_PROVIDER=openrouter
      - AI_API_KEY=${OPENROUTER_API_KEY}
      - AI_MODEL=nvidia/nemotron-3-ultra-550b-a55b:free
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./SENTINEL/sentinel:/app
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    restart: unless-stopped
    networks:
      - aura-network

  # ──────────────────────────────────────────────────────────────
  # SENTINEL Web (Next.js)
  # ──────────────────────────────────────────────────────────────
  sentinel-web:
    build:
      context: ./SENTINEL/sentinel
      dockerfile: apps/web/Dockerfile
    ports:
      - "3002:3000"
    environment:
      - NODE_ENV=development
      - PORT=3000
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    depends_on:
      - sentinel-api
    volumes:
      - ./SENTINEL/sentinel/apps/web:/app
      - /app/node_modules
      - /app/.next
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    networks:
      - aura-network

  # ──────────────────────────────────────────────────────────────
  # Shared Infrastructure
  # ──────────────────────────────────────────────────────────────
  postgres:
    image: postgres:15-alpine
    environment:
      - POSTGRES_USER=forge
      - POSTGRES_PASSWORD=forge
      - POSTGRES_DB=forge
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./FORGE/docker/init-sentinel-db.sh:/docker-entrypoint-initdb.d/init-sentinel-db.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U forge -d forge"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - aura-network

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - aura-network

volumes:
  postgres-data:
  redis-data:
  aura-learning:
  aura-skills:

networks:
  aura-network:
    driver: bridge